[package]
name = "mlmorph"
version = "1.4.2"
edition = "2024"
description = "Malayalam morphological analyzer"
license = "MIT"
authors = ["Santhosh Thottingal <santhosh.thottingal@gmail.com>"]
include = [
  "src/**/*",
  "data/malayalam.a",
  "Cargo.toml",
  "README.md",
  "LICENSE.md",
]

[[bin]]
name = "mlmorph"
path = "src/main.rs"

[dependencies]
sfst = "0.2.0"
regex = "1.0"
lazy_static = "1.5.0"
clap = { version = "4.0", features = ["derive"] }
include_dir = "0.7.4"
tempfile = "3.21.0"
