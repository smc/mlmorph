[package]
name = "mlmorph"
version = "1.4.0"
edition = "2024"
include = [
  "src/**/*",
  "data/malayalam.a",
  "Cargo.toml",
  "README.md",
  "LICENSE.md",
]

[[bin]]
name = "mlmorph"
path = "src/main.rs"

[dependencies]
sfst = "0.1.0"
regex = "1.0"
lazy_static = "1.5.0"
clap = { version = "4.0", features = ["derive"] }
